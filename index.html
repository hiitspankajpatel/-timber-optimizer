<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timber Optimizer</title>

<style>
body{
font-family:Arial,sans-serif;
padding:20px;
background:#f5f5f5;
}

.container{
max-width:700px;
margin:auto;
background:white;
padding:20px;
border-radius:10px;
}

h1,h2{
text-align:center;
}

table{
width:100%;
border-collapse:collapse;
margin-bottom:20px;
}

th,td{
border:1px solid #ddd;
padding:10px;
text-align:center;
}

input{
width:90%;
padding:10px;
}

button{
width:100%;
padding:15px;
margin-top:10px;
font-size:18px;
}

.result{
background:#eef7ff;
padding:15px;
border-radius:10px;
margin-top:20px;
}
</style>
</head>

<body>

<div class="container">

<h1>Timber Optimizer</h1>

<h2>Stock Available</h2>

<table id="stockTable">
<tr>
<th>Wood Length (ft)</th>
<th>Quantity</th>
</tr>

<tr><td>3</td><td><input type="number" value="0"></td></tr>
<tr><td>3.25</td><td><input type="number" value="0"></td></tr>
<tr><td>3.5</td><td><input type="number" value="0"></td></tr>
<tr><td>3.75</td><td><input type="number" value="0"></td></tr>
<tr><td>4</td><td><input type="number" value="0"></td></tr>
<tr><td>4.25</td><td><input type="number" value="0"></td></tr>
<tr><td>4.5</td><td><input type="number" value="0"></td></tr>
<tr><td>4.75</td><td><input type="number" value="0"></td></tr>
<tr><td>5</td><td><input type="number" value="0"></td></tr>
<tr><td>5.25</td><td><input type="number" value="0"></td></tr>
<tr><td>5.5</td><td><input type="number" value="0"></td></tr>
<tr><td>5.75</td><td><input type="number" value="0"></td></tr>
<tr><td>6</td><td><input type="number" value="0"></td></tr>
<tr><td>6.25</td><td><input type="number" value="0"></td></tr>
<tr><td>6.5</td><td><input type="number" value="0"></td></tr>
<tr><td>6.75</td><td><input type="number" value="0"></td></tr>
<tr><td>7</td><td><input type="number" value="0"></td></tr>
<tr><td>7.25</td><td><input type="number" value="0"></td></tr>
<tr><td>7.5</td><td><input type="number" value="0"></td></tr>
<tr><td>7.75</td><td><input type="number" value="0"></td></tr>
<tr><td>8</td><td><input type="number" value="0"></td></tr>
<tr><td>8.25</td><td><input type="number" value="0"></td></tr>
<tr><td>8.5</td><td><input type="number" value="0"></td></tr>
<tr><td>8.75</td><td><input type="number" value="0"></td></tr>
<tr><td>9</td><td><input type="number" value="0"></td></tr>
</table>

<h2>Order Details</h2>

<table id="orderTable">
<tr>
<th>Inch Size</th>
<th>Quantity</th>
</tr>

<tr>
<td><input type="number" placeholder="57"></td>
<td><input type="number" placeholder="3"></td>
</tr>
</table>

<button onclick="addRow()">+ Add Row</button>
<button onclick="optimize()">Optimize</button>

<div class="result" id="result">
Waiting for order...
</div>

</div>

<script>
function addRow(){

let table =
document.getElementById("orderTable");

let row =
table.insertRow();

row.innerHTML =
`
<td><input type="number"></td>
<td><input type="number"></td>
`;
}

function optimize(){

let rows =
document.querySelectorAll("#orderTable tr");

let total = 0;

for(let i=1;i<rows.length;i++){

let inputs =
rows[i].querySelectorAll("input");

let inch =
parseFloat(inputs[0].value)||0;

let qty =
parseInt(inputs[1].value)||0;

total += inch * qty;
}

let stockRows =
document.querySelectorAll("#stockTable tr");

let best = null;

for(let i=1;i<stockRows.length;i++){

let qtyInput =
stockRows[i]
.querySelector("input");

let qty =
parseInt(qtyInput.value)||0;

if(qty<=0) continue;

let ft =
parseFloat(
stockRows[i].cells[0].innerText
);

let inches = ft * 12;

if(inches >= total){

best = {
ft:ft,
waste:(inches-total)
};

break;
}
}

if(best){

document.getElementById("result")
.innerHTML =
"Suggested wood length: <b>"
+ best.ft +
" ft</b><br>Total order: "
+ total +
" inches<br>Wastage: "
+ best.waste.toFixed(2)
+ " inches";

}else{

document.getElementById("result")
.innerHTML =
"No suitable stock found";
}
}
</script>

</body>
</html>
