<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timber Optimizer</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f4f4f4;
padding:20px;
}

.container{
max-width:900px;
margin:auto;
background:white;
padding:20px;
border-radius:12px;
}

table{
width:100%;
border-collapse:collapse;
margin-bottom:20px;
}

th,td{
border:1px solid #ddd;
padding:10px;
text-align:center;
}

input{
width:90%;
padding:8px;
}

button{
width:100%;
padding:14px;
font-size:18px;
margin-top:10px;
}

.result{
background:#eef7ff;
padding:15px;
margin-top:20px;
border-radius:10px;
}
</style>
</head>

<body>

<div class="container">

<h1>Timber Optimizer</h1>

<h2>Stock Available</h2>

<table id="stockTable">
<tr>
<th>Wood Length (ft)</th>
<th>Quantity</th>
</tr>
</table>

<h2>Order Details</h2>

<table id="orderTable">
<tr>
<th>Inch Size</th>
<th>Quantity</th>
</tr>

<tr>
<td><input type="number"></td>
<td><input type="number"></td>
</tr>
</table>

<button onclick="addRow()">+ Add Row</button>
<button onclick="optimize()">Optimize</button>

<div id="result" class="result">
Waiting for optimization...
</div>

</div>

<script>

const stockLengths=[];

for(let ft=3;ft<=9;ft+=0.25){
stockLengths.push(ft);
}

const stockTable =
document.getElementById("stockTable");

stockLengths.forEach(ft=>{
let row = stockTable.insertRow();

row.innerHTML=
`
<td>${ft}</td>
<td><input type="number" value="0"></td>
`;
});

function addRow(){

let table =
document.getElementById("orderTable");

let row = table.insertRow();

row.innerHTML=
`
<td><input type="number"></td>
<td><input type="number"></td>
`;
}

function optimize(){

let pieces=[];

let orderRows =
document.querySelectorAll("#orderTable tr");

for(let i=1;i<orderRows.length;i++){

let inputs=
orderRows[i]
.querySelectorAll("input");

let inch=
parseFloat(inputs[0].value)||0;

let qty=
parseInt(inputs[1].value)||0;

for(let q=0;q<qty;q++){
pieces.push(inch);
}
}

pieces.sort((a,b)=>b-a);

let stock=[];

let stockRows=
document.querySelectorAll("#stockTable tr");

for(let i=1;i<stockRows.length;i++){

let ft=
parseFloat(
stockRows[i].cells[0].innerText
);

let qty=
parseInt(
stockRows[i]
.querySelector("input").value
)||0;

for(let q=0;q<qty;q++){

stock.push({
ft:ft,
inch:ft*12
});
}
}

stock.sort((a,b)=>a.inch-b.inch);

let results=[];

for(let wood of stock){

let current=[];
let used=0;

for(let i=0;i<pieces.length;i++){

if(
used + pieces[i]
<= wood.inch
){

current.push(
pieces[i]
);

used += pieces[i];

pieces[i]=-1;
}
}

pieces=
pieces.filter(x=>x!==-1);

if(current.length){

results.push({
ft:wood.ft,
cuts:current,
waste:
wood.inch-used
});
}

if(!pieces.length){
break;
}
}

if(results.length===0){

document
.getElementById("result")
.innerHTML=
"No suitable stock found";

return;
}

let html="<h3>Suggested Plans</h3>";

results.forEach((r,index)=>{

html +=
`
<p>
<b>Option ${index+1}</b><br>
Take <b>${r.ft} ft</b><br>
Cut: ${r.cuts.join(" + ")}<br>
Waste: <b>${r.waste}"</b>
</p>
<hr>
`;
});

if(pieces.length){

html +=
`<p>
⚠️ Remaining pieces not fulfilled:
${pieces.join(", ")}
</p>`;
}

document
.getElementById("result")
.innerHTML=html;
}

</script>

</body>
</html>
